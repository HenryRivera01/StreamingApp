<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reproductor</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="dark">
    <div class="player-header">
      <div>
        <a href="./dashboard.html" class="text-link">← Volver</a>
      </div>
      <button id="btnLogout" class="btn">Salir</button>
    </div>

    <section id="playerHero" class="player-hero hero-backdrop">
      <div class="hero-overlay">
        <h2 id="playerTitle">Reproduciendo</h2>
        <p id="playerMeta" class="player-meta"></p>
        <p id="ratingSummary" class="rating-summary"></p>
        <div id="ratingControls" class="rating-controls"></div>
        <p
          id="playerSinopsis"
          class="panel"
          style="
            margin-top: 12px;
            max-width: 60%;
            background: transparent;
            border: 0;
            padding: 0;
            color: var(--text);
          "
        ></p>
      </div>
    </section>

    <!-- Resume modal -->
    <div id="resumeModal" class="modal hidden" aria-hidden="true">
      <div class="modal-dialog panel">
        <p id="resumeMessage"></p>
        <div
          style="
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
          "
        >
          <button id="btnRestart" class="btn">Empezar desde 0</button>
          <button id="btnResume" class="btn primary">Reanudar</button>
        </div>
      </div>
    </div>

    <div class="video-container">
      <video id="video" controls preload="metadata"></video>
    </div>
    <script src="../js/player.js"></script>
  </body>
</html>
