services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-streaming
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/neo4j_password"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p neo4j_password 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: streaming-backend
    env_file:
      - ./backend/.env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_SEED_ON_START: "true"
      FRONTEND_PATH: "/frontend"
    ports:
      - "4000:4000"
    volumes:
      - ./frontend:/frontend:ro
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
